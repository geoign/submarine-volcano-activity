<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submarine Volcano Activity Database</title>
<meta name="description" content="A satellite record of shallow submarine volcanoes worldwide since 2013: discoloured water, pumice, new land and other signs seen in Sentinel-2, Landsat and low-resolution imagery, with the reviews of the detections.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/css/style.css?v=3">
</head>
<body data-title="nav.map">
<main class="wrap">
  <h1 data-i18n="site.title">Submarine Volcano Activity Database</h1>
  <p class="lead" data-i18n="map.lead"></p>

  <div class="filters" role="group" aria-label="Filters">
    <div class="seg" id="period" role="group" data-i18n-label="map.period">
      <button type="button" data-period="all" aria-pressed="true" data-i18n="map.period.all"></button>
      <button type="button" data-period="5y" aria-pressed="false" data-i18n="map.period.5y"></button>
      <button type="button" data-period="1y" aria-pressed="false" data-i18n="map.period.1y"></button>
    </div>
    <input type="search" id="search" data-i18n-placeholder="map.search" data-i18n-label="map.search">
    <div class="chips" id="classes" role="group" data-i18n-label="map.classes"></div>
  </div>

  <div class="map-layout">
    <div id="map" role="application" aria-label="Map of the volcanoes"></div>
    <div class="vlist" id="list" aria-live="polite"></div>
  </div>
  <noscript><p class="error">This page needs JavaScript. The data are plain CSV files under <a href="db/">db/</a>.</p></noscript>
</main>
<script src="assets/vendor/leaflet/leaflet.js"></script>
<script type="module" src="assets/js/map.js?v=3"></script>
</body>
</html>
